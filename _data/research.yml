  - title: "Caraga Mining Governance Index"
  institution: USAID
  type: Report
  year: 2017
  summary: >-
     The Caraga Mining Governance Index (CMGI) is a benchmarking tool aimed at measuring the quality of resource governance among mining provinces
     in the Philippines. The CMGI has three components mainly: (1) Local Impact Monitoring; (2) Mining Benefit Management; (3), and Local Governance.
     These components are designed to measure a province’s effectiveness in governing mineral extraction from licensing, monitoring impacts,
     to maximizing the localities’ benefits from mining. Each component will have subcomponents as described in the next sections.
     Scores will be generated to identify strengths and opportunities for policy reforms. 
  tags: critical-minerals revenue-management philippines subnational governance
  link: ""


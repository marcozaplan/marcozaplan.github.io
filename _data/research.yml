- title: "Mapping of Just Transition supporting policies in Southeast Asia"
  institution: Oxfam Pilipinas
  type: Report
  year: 2025
  summary: >-
     This study systematically maps and assesses how just transition (JT) principles are reflected
     in energy transition policies across four Southeast Asian countries: Indonesia, the Philippines,
     Thailand, and Malaysia. The research focuses on identifying how justice-related concepts—such as
     equity, inclusion, and environmental rehabilitation—are embedded in national policy frameworks,
     even when the term “just transition” is not explicitly used. The study covers a wide range of
     policy instruments, including more strategic plans/goals/guidelines, formal regulatory acts/laws
     and dedicated financing schemes, and evaluates their ambition and coherence.

  tags: energy policy-analysis southeast-asia philippines qualitative
  link: "https://oxfam.org.ph/download/mapping-of-just-transition-supporting-policies-in-southeast-asia/"

  - title: "Just Transition in Southeast Asia: Advancing People-centered and Equitable Transformation in the Agriculture and Transportation Sector"
  institution: Oxfam Pilipinas
  type: Report
  year: 2024
  summary: >-
     Southeast Asia is a significant emitter of greenhouse gases (GHGs), necessitating a shift towards sustainable and less carbon-intensive
     practices to combat climate change. The region faces formidable challenges in transitioning economies away from fossil fuels while
     promoting economic development and reducing emissions. Our recent research outlines existing gaps and challenges in transitioning
     away from carbon-intensive agricultural and transport practices. A fast, just, and transformative transition strategy is
     imperative to ensure that the transition does not exacerbate existing inequities and environmental issues.
  
  tags: energy policy-analysis southeast-asia philippines qualitative indonesia 
  link: "https://oxfam.org.ph/download/mapping-of-just-transition-supporting-policies-in-southeast-asia/"

  - title: "Energy Transition Minerals Governance and Mining Revenue Management in Cebu and Palawan in the Philippines"

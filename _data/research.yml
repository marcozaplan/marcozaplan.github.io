- title: "Green, Pink, and Red: Measuring and Analyzing Affective Polarization in the Philippines"
  institution: MSc dissertation, London School of Economics and Political Science
  type: Capstone project
  year: 2026
  summary: >-
    Affective polarisation or the tendency for voters to dislike and distrust
    opposing political groups has steadily increased around the world.
    The current literature has largely focused on Western democracies with
    institutionalized political party systems. The Philippines presents a
    unique case with its large democracy, ethnolinguistically diverse population,
    weakly-institutionalized political party system, and personality-based politics.
    Guided by the social identity theory, this study measured and investigated how
    affective polarisation is operationalized in such context and to what extent does
    attachment to one’s ethnolinguistic identity relate to it using nonrandom survey data (n=249)
    and the three major political camps (Duterte, Marcos, and Robredo) as the unit of analyses.
    Robredo supporters were among the most affectively polarized relative to the other camps.
    It found that significant levels of affective polarization can emerge in this context and
    is largely structured by the strength of camp identification and not one’s ethnolinguistic
    identity. While levels of affective polarization are substantial, this relationship
    does not extend to social distancing behavior. This study offers a validated and robust
    quantitative measure and analysis of how affective polarization operates in
    a personality-based political system and fills in the geographic, methodological,
    and theoretical gaps in the literature.
  tags: affective-polarization philippines elections quantitative survey-methodology
  link: ""

- title: "From Transparency, Accountability, and Responsiveness to Trust: What are significant predictors of perceived levels of trust in the Department of Budget and Management among public administration students of the Marinduque State College?"
  institution: Ateneo de Manila University
  type: Capstone project
  year: 2024
  summary: >-
    Trust is very important in governance. Over the last twelve years, the government has
    instituted various good governance initiatives to help build trust in our public institutions.
    Trust in government, however, has not improved. This Governance Innovation Report (GIR) conducted
    a quantitative study among public administration students from the Marinduque State College to
    investigate the relationship between perceived levels of transparency, accountability, and
    responsiveness and perceived levels of trust toward the Department of Budget Management (DBM).
    Results showed that all three pillars of good governance are significant predictors of overall
    trust in the DBM with perceived responsiveness having the highest coefficient
    followed by perceived accountability and transparency.
  tags: trust government youth philippines quantitative
  link: ""

